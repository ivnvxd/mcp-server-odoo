name: CI

# push runs only on long-lived branches; the pull_request trigger covers
# feature branches ('*' did not match slash-named branches and double-ran
# flat-named branches with open PRs)
on:
  push:
    branches: [main, dev]
  pull_request:
    # '**', not '*': '*' does not match a '/', so PRs against release/* ran no CI
    branches: ['**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and Type Check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "latest"
        enable-cache: true

    - name: Install dependencies
      run: |
        uv pip install --system -e ".[dev]"

    - name: Check code formatting with Ruff
      run: |
        ruff format --check --diff .

    - name: Lint with Ruff
      run: |
        ruff check . --output-format=github

    - name: Type check with ty
      run: |
        ty check .

  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "latest"
        enable-cache: true

    - name: Install dependencies
      run: |
        uv pip install --system -e ".[dev]"

    - name: Run unit tests with coverage
      run: |
        pytest -m "not yolo and not mcp" --cov=mcp_server_odoo --cov-report=xml:coverage-unit.xml --cov-report=term
      env:
        ODOO_URL: ${{ vars.ODOO_URL || 'http://localhost:8069' }}
        ODOO_DB: ${{ vars.ODOO_DB || 'test' }}
        ODOO_API_KEY: ${{ vars.ODOO_API_KEY || 'test_api_key' }}
        ODOO_USER: ${{ vars.ODOO_USER || 'admin' }}
        ODOO_PASSWORD: ${{ vars.ODOO_PASSWORD || 'admin' }}

    - name: Upload coverage artifact
      if: matrix.python-version == '3.10'
      uses: actions/upload-artifact@v7
      with:
        name: coverage-unit
        path: coverage-unit.xml

  yolo-integration-test:
    name: YOLO Integration Tests (Odoo ${{ matrix.odoo }})
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    strategy:
      fail-fast: false
      matrix:
        odoo: ['16', '17', '18', '19', '20']

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U odoo"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "latest"
        enable-cache: true

    - name: Install dependencies
      run: |
        uv pip install --system -e ".[dev]"

    - name: Start Odoo and initialize database
      run: |
        # --http-interface 0.0.0.0: Odoo 20 listens on 127.0.0.1 by default,
        # which the published port cannot reach
        docker run -d --name odoo --network "${{ job.services.postgres.network }}" \
          -e HOST=postgres -e USER=odoo -e PASSWORD=odoo \
          -p 8069:8069 \
          odoo:${{ matrix.odoo }} -- --http-interface 0.0.0.0 --database test --init base,mail --without-demo all

        # Wait for Odoo to finish initializing
        echo "Waiting for Odoo to initialize database..."
        for i in $(seq 1 60); do
          if python -c "
        import xmlrpc.client
        try:
            proxy = xmlrpc.client.ServerProxy('http://localhost:8069/xmlrpc/2/common')
            uid = proxy.authenticate('test', 'admin', 'admin', {})
            if uid:
                print(f'Odoo ready, authenticated as uid={uid}')
                exit(0)
        except Exception as e:
            exit(1)
        " 2>/dev/null; then
            echo "Odoo is ready!"
            exit 0
          fi
          echo "Waiting... ($i/60)"
          sleep 5
        done
        # Fail here: tests/conftest.py skips every test when Odoo does not
        # answer, so the leg would pass while testing nothing
        echo "::error::Odoo did not answer within 5 minutes"
        docker logs --tail 50 odoo
        exit 1

    - name: Generate API key for admin user
      id: yolo-apikey
      run: |
        # Generate a random API key and compute its passlib hash inside the
        # Odoo container (which already has passlib installed).
        KEY_AND_HASH=$(docker exec odoo python3 -c "
        import secrets
        from passlib.context import CryptContext
        key = secrets.token_hex(20)
        ctx = CryptContext(['pbkdf2_sha512'])
        key_hash = ctx.hash(key)
        # Use pipe separator — safe because neither key nor hash contains |
        print(f'{key}|{key_hash}')
        ")

        API_KEY=$(echo "$KEY_AND_HASH" | cut -d'|' -f1)
        KEY_HASH=$(echo "$KEY_AND_HASH" | cut -d'|' -f2)
        INDEX=${API_KEY:0:8}

        # Insert into Odoo's API key table using dollar-quoting for the hash
        # (passlib hashes contain $ characters that break normal SQL quoting).
        # Note: res_users_apikeys has _log_access=False, so no create_uid/write_uid columns.
        # Scope 'rpc': Odoo 20 matches the scope exactly; 16 to 19 also accept NULL.
        PGPASSWORD=odoo psql -h localhost -U odoo -d test -c \
          "INSERT INTO res_users_apikeys (name, user_id, scope, index, key)
           VALUES ('CI Test Key', 2, 'rpc', '${INDEX}', \$hash\$${KEY_HASH}\$hash\$)"

        echo "key=${API_KEY}" >> "$GITHUB_OUTPUT"
        echo "API key generated and inserted for admin user"

    - name: Run YOLO integration tests
      run: |
        pytest -m "yolo" -v --cov=mcp_server_odoo --cov-report=xml:coverage-yolo-${{ matrix.odoo }}.xml --cov-report=term
      env:
        ODOO_URL: http://localhost:8069
        ODOO_DB: test
        ODOO_USER: admin
        ODOO_PASSWORD: admin
        ODOO_YOLO: "true"
        ODOO_MCP_ENABLE_METHOD_CALLS: "true"
        ODOO_API_KEY: ${{ steps.yolo-apikey.outputs.key }}

    - name: Upload coverage artifact
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: coverage-yolo-${{ matrix.odoo }}
        path: coverage-yolo-${{ matrix.odoo }}.xml

  mcp-integration-test:
    # Each leg runs the module branch of its Odoo version
    name: MCP Integration Tests (Odoo ${{ matrix.odoo }})
    runs-on: ubuntu-latest
    needs: [lint, test]
    # Skip for fork PRs AND Dependabot PRs — repository secrets
    # (MCP_MODULE_PAT) are not available to either: forks never get them,
    # and Dependabot-triggered workflows read from the separate (empty)
    # Dependabot secrets store. Lint/unit/YOLO jobs still cover those PRs.
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'))
      || (github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.actor != 'dependabot[bot]')
    strategy:
      fail-fast: false
      matrix:
        odoo: ['16', '17', '18', '19', '20']

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U odoo"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
    - uses: actions/checkout@v7

    - name: Checkout MCP Odoo module
      uses: actions/checkout@v7
      with:
        repository: much-GmbH/much-mcp-server
        ref: '${{ matrix.odoo }}.0'
        path: odoo-apps
        token: ${{ secrets.MCP_MODULE_PAT }}

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "latest"
        enable-cache: true

    - name: Install dependencies
      run: |
        uv pip install --system -e ".[dev]"

    - name: Build Odoo image with the module's Python dependencies
      run: |
        # mcp_server declares external_dependencies in its manifest (2.x:
        # authlib, defusedxml, packaging; 1.x: defusedxml); Odoo refuses to
        # install the module if any are missing. They are read from the
        # branch's own manifest, with its version constraints.
        # PIP_BREAK_SYSTEM_PACKAGES, not the flag: pip 20 and 22 in the
        # odoo:16 and odoo:17 images do not know --break-system-packages.
        DEPS=$(python -c "import ast, shlex; m = ast.literal_eval(open('odoo-apps/mcp_server/__manifest__.py').read()); print(' '.join(shlex.quote(d) for d in m.get('external_dependencies', {}).get('python', [])))")
        echo "Module dependencies: $DEPS"
        cat > Dockerfile.ci <<EOF
        FROM odoo:${{ matrix.odoo }}
        USER root
        ENV PIP_BREAK_SYSTEM_PACKAGES=1
        RUN python3 -m pip install --no-cache-dir $DEPS
        USER odoo
        EOF
        docker build -t odoo-mcp-ci:${{ matrix.odoo }} -f Dockerfile.ci .

    - name: Start Odoo with MCP module and initialize database
      run: |
        # --http-interface 0.0.0.0: see the YOLO job
        docker run -d --name odoo-mcp --network "${{ job.services.postgres.network }}" \
          -e HOST=postgres -e USER=odoo -e PASSWORD=odoo \
          -v "${{ github.workspace }}/odoo-apps:/mnt/extra-addons" \
          -p 8069:8069 \
          odoo-mcp-ci:${{ matrix.odoo }} -- --http-interface 0.0.0.0 --database test --init base,mcp_server --without-demo all

        # Wait for Odoo to finish initializing (includes MCP module install)
        echo "Waiting for Odoo to initialize database with MCP module..."
        for i in $(seq 1 90); do
          if python -c "
        import xmlrpc.client
        try:
            proxy = xmlrpc.client.ServerProxy('http://localhost:8069/xmlrpc/2/common')
            uid = proxy.authenticate('test', 'admin', 'admin', {})
            if uid:
                print(f'Odoo ready, authenticated as uid={uid}')
                exit(0)
        except Exception as e:
            exit(1)
        " 2>/dev/null; then
            echo "Odoo is ready!"
            exit 0
          fi
          echo "Waiting... ($i/90)"
          sleep 5
        done
        echo "::error::Odoo did not answer within 7.5 minutes"
        docker logs --tail 50 odoo-mcp
        exit 1

    - name: Configure MCP module
      run: |
        python -c "
        import xmlrpc.client

        url = 'http://localhost:8069'
        db = 'test'

        common = xmlrpc.client.ServerProxy(f'{url}/xmlrpc/2/common')
        uid = common.authenticate(db, 'admin', 'admin', {})
        assert uid, 'Failed to authenticate'
        print(f'Authenticated as uid={uid}')

        models = xmlrpc.client.ServerProxy(f'{url}/xmlrpc/2/object')

        # Enable MCP with API key validation. Rate limiting is disabled in CI:
        # the suite hits the addon's ~300/min ceiling because all tests run
        # under the single admin API key. Disabling it here keeps tests
        # deterministic — production deployments leave it on (default True).
        for param, value in [
            ('mcp_server.enabled', 'True'),
            ('mcp_server.use_api_keys', 'True'),
            ('mcp_server.enable_rate_limiting', 'False'),
        ]:
            # search/write/create, not set_param: Odoo 20 replaced it with
            # typed setters (set_bool, set_str)
            ids = models.execute_kw(db, uid, 'admin', 'ir.config_parameter', 'search', [[('key', '=', param)]])
            if ids:
                models.execute_kw(db, uid, 'admin', 'ir.config_parameter', 'write', [ids, {'value': value}])
            else:
                models.execute_kw(db, uid, 'admin', 'ir.config_parameter', 'create', [{'key': param, 'value': value}])
        print('MCP enabled, API keys enabled, rate limiting disabled (CI only)')

        # Enable models with permissions matching auth-test-matrix.md:
        # - res.partner: read+write+unlink only (create=False for restricted ops test)
        # - res.company: full CRUD (used by write cycle tests)
        # - res.country: read only (unlink=False for restricted ops test)
        # - res.users: NOT enabled (read denied for restricted ops test)
        model_permissions = {
            'res.partner': {'allow_read': True, 'allow_create': False, 'allow_write': True, 'allow_unlink': True},
            'res.company': {'allow_read': True, 'allow_create': True, 'allow_write': True, 'allow_unlink': True},
            'res.country': {'allow_read': True, 'allow_create': False, 'allow_write': False, 'allow_unlink': False},
        }
        for model_name, perms in model_permissions.items():
            model_ids = models.execute_kw(db, uid, 'admin', 'ir.model', 'search', [
                [('model', '=', model_name)]
            ])
            if model_ids:
                models.execute_kw(db, uid, 'admin', 'mcp.enabled.model', 'create', [{
                    'model_id': model_ids[0],
                    **perms,
                }])
                print(f'Enabled model: {model_name} {perms}')
        print('MCP setup complete (res.users intentionally NOT enabled)')
        "

    - name: Generate API key for admin user
      id: mcp-apikey
      run: |
        KEY_AND_HASH=$(docker exec odoo-mcp python3 -c "
        import secrets
        from passlib.context import CryptContext
        key = secrets.token_hex(20)
        ctx = CryptContext(['pbkdf2_sha512'])
        key_hash = ctx.hash(key)
        print(f'{key}|{key_hash}')
        ")

        API_KEY=$(echo "$KEY_AND_HASH" | cut -d'|' -f1)
        KEY_HASH=$(echo "$KEY_AND_HASH" | cut -d'|' -f2)
        INDEX=${API_KEY:0:8}

        PGPASSWORD=odoo psql -h localhost -U odoo -d test -c \
          "INSERT INTO res_users_apikeys (name, user_id, scope, index, key)
           VALUES ('CI Test Key', 2, 'rpc', '${INDEX}', \$hash\$${KEY_HASH}\$hash\$)"

        echo "key=${API_KEY}" >> "$GITHUB_OUTPUT"
        echo "API key generated and inserted for admin user"

    - name: Restart Odoo and require /mcp/health
      run: |
        # The 1.x module (Odoo 16 and 17) caches is_mcp_enabled() for five
        # minutes, so the configuration above takes effect only after a
        # restart. A new container without --init: restarting the old one
        # would run the module install again.
        docker rm -f odoo-mcp
        docker run -d --name odoo-mcp --network "${{ job.services.postgres.network }}" \
          -e HOST=postgres -e USER=odoo -e PASSWORD=odoo \
          -v "${{ github.workspace }}/odoo-apps:/mnt/extra-addons" \
          -p 8069:8069 \
          odoo-mcp-ci:${{ matrix.odoo }} -- --http-interface 0.0.0.0 --database test

        # Without /mcp/health, tests/conftest.py skips every mcp-marked test
        # and the leg would pass while testing nothing.
        for i in $(seq 1 60); do
          if curl -fsS http://localhost:8069/mcp/health; then
            exit 0
          fi
          sleep 2
        done
        echo "::error::GET /mcp/health did not answer, so every mcp-marked test would skip"
        docker logs --tail 50 odoo-mcp
        exit 1

    - name: Run MCP integration tests
      run: |
        pytest -m "mcp" -v --cov=mcp_server_odoo --cov-report=xml:coverage-mcp-${{ matrix.odoo }}.xml --cov-report=term
      env:
        ODOO_URL: http://localhost:8069
        ODOO_DB: test
        ODOO_USER: admin
        ODOO_PASSWORD: admin
        ODOO_API_KEY: ${{ steps.mcp-apikey.outputs.key }}

    - name: Upload coverage artifact
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: coverage-mcp-${{ matrix.odoo }}
        path: coverage-mcp-${{ matrix.odoo }}.xml

  coverage:
    name: Upload Coverage
    runs-on: ubuntu-latest
    needs: [test, yolo-integration-test, mcp-integration-test]
    if: always()

    steps:
    - uses: actions/checkout@v7

    - name: Download coverage artifacts
      uses: actions/download-artifact@v8
      with:
        pattern: coverage-*
        merge-multiple: true
        path: coverage-reports

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'

    - name: Merge and upload coverage
      uses: codecov/codecov-action@v7
      with:
        directory: coverage-reports
        flags: all
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [lint, test, yolo-integration-test, mcp-integration-test]
    if: |
      always()
      && needs.lint.result == 'success'
      && needs.test.result == 'success'
      && (needs.yolo-integration-test.result == 'success' || needs.yolo-integration-test.result == 'skipped')
      && (needs.mcp-integration-test.result == 'success' || needs.mcp-integration-test.result == 'skipped')

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'

    - name: Install build tools
      run: |
        pip install build twine

    - name: Build package
      run: |
        python -m build

    - name: Check package
      run: |
        twine check dist/*

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: python-package-distributions
        path: dist/
